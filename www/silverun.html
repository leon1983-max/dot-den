<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<title>Silverun · The Dot Den</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaedf3; --ink:#161a22; --muted:#5f6778; --line:#d6dbe4;
    --accent:#1f7a8c; --accent-ink:#ffffff; --accent-soft:#1f7a8c1a;
    --silver:#8a94a6; --gold:#b7791f; --gold-soft:#b7791f1f; --good:#1e8e4e; --good-soft:#1e8e4e1a;
    --warn:#b45309; --warn-soft:#b453091a;
    --shadow:0 18px 36px -24px rgba(20,24,40,.35); --radius:18px;
    --body:'Work Sans',system-ui,sans-serif; --display:'Unbounded',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1117; --surface:#181b24; --surface-2:#222633; --ink:#eef1f7; --muted:#9aa3b5; --line:#2e3342;
      --accent:#5cc8d9; --accent-ink:#0b1a1e; --accent-soft:#5cc8d91f;
      --silver:#b7c0d0; --gold:#f2b84b; --gold-soft:#f2b84b1f; --good:#4fd08a; --good-soft:#4fd08a1c;
      --warn:#f59e0b; --warn-soft:#f59e0b1c;
      --shadow:0 18px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1117; --surface:#181b24; --surface-2:#222633; --ink:#eef1f7; --muted:#9aa3b5; --line:#2e3342;
    --accent:#5cc8d9; --accent-ink:#0b1a1e; --accent-soft:#5cc8d91f;
    --silver:#b7c0d0; --gold:#f2b84b; --gold-soft:#f2b84b1f; --good:#4fd08a; --good-soft:#4fd08a1c;
    --warn:#f59e0b; --warn-soft:#f59e0b1c;
    --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  }
  :root[lang="he"]{ --body:'Rubik','Work Sans',system-ui,sans-serif; --display:'Rubik','Unbounded',system-ui,sans-serif; }
  :root[lang="he"] h1,:root[lang="he"] h2,:root[lang="he"] h3,:root[lang="he"] .brand,:root[lang="he"] .tm-kind{font-weight:800;letter-spacing:0}
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
    padding:0 16px calc(90px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
  h1,h2,h3,.brand{font-family:var(--display);margin:0;text-wrap:balance}
  h2{font-size:1.15rem} h3{font-size:1rem}
  p{margin:0}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr}
  .num{unicode-bidi:isolate;direction:ltr;display:inline-block}
  .wrap{max-width:720px;margin:0 auto}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}

  header.site{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 10px}
  .brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
  .brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--silver),var(--accent));color:#fff}
  .brand-mark svg{width:20px;height:20px}
  :root[dir="rtl"] .brand-mark svg{transform:scaleX(-1)}
  .back{font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:8px 0}
  .back:hover{color:var(--ink)}
  .hdr-r{display:flex;gap:8px}
  .iconbtn{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0 8px;font-weight:700}
  .iconbtn svg{width:20px;height:20px}
  .iconbtn:disabled{opacity:.4}

  .goal{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:end;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
  .goal .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .goal .val{font-weight:700}
  .goal-bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--silver),var(--accent));border-radius:6px}
  :root[dir="rtl"] .goal-bar i{background:linear-gradient(270deg,var(--silver),var(--accent))}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted)}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card.flat{box-shadow:none}
  .eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
  :root[lang="he"] .eyebrow,:root[lang="he"] .goal .lbl{letter-spacing:0;font-size:.8rem}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 12px;min-height:36px;font-size:.875rem}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.block{width:100%}

  .daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .daynav h1{font-size:1.35rem;text-align:center}
  .daynav .sub{font-size:.85rem;color:var(--muted);text-align:center}

  .q h3{margin-bottom:10px}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:420px){.chips{grid-template-columns:repeat(2,1fr)}}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:600;font-size:.9rem;min-height:46px}
  .chip.suggest{border-style:dashed;border-color:var(--muted)}
  .answered{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .note{border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
  .note.info{background:var(--accent-soft)}
  .note.warn{background:var(--warn-soft)}

  .sess-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .sess-head h2{font-size:1.3rem;margin-top:4px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .tag.hard{background:var(--warn-soft);color:var(--warn)}
  .tag.easy{background:var(--good-soft);color:var(--good)}
  .tag.done{background:var(--good);color:#fff}
  .why{margin:8px 0 14px;color:var(--muted)}
  .progress{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:var(--good);border-radius:8px;transition:width .25s}

  .group{margin-top:14px}
  .group > .eyebrow{margin-bottom:4px}
  .check{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .check:last-child{border-bottom:0}
  .check input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin:0;cursor:pointer}
  .check input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
  .check input[type=checkbox]:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .check .txt{flex:1;padding-top:2px}
  .check.on .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .check .sub{display:block;font-size:.82rem;color:var(--muted)}
  .timein{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .timein input{width:96px}
  .parsed{font-size:.82rem;color:var(--muted)}

  label.f{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
    width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
  input.ltr,input[type=email],input[type=password]{direction:ltr;text-align:start}
  :root[dir="rtl"] input.ltr{text-align:right}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .feel{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:ltr}
  .feel button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;font-weight:700;font-size:.9rem;padding:0}
  .feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .feel-legend{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px;direction:ltr}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .actions .btn,.actions select{flex:1}

  .ideas{margin:10px 0 0;padding-inline-start:20px;padding-inline-end:0}
  .ideas li{margin:4px 0}

  table.t{width:100%;border-collapse:collapse;font-size:.9rem}
  table.t th,table.t td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .wk{padding:10px 12px;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
  .wk.cur{border-color:var(--accent);background:var(--accent-soft)}
  .wk-n{font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center}
  .wk-r{display:grid;grid-template-columns:112px 1fr;gap:8px;font-size:.86rem;padding:2px 0}
  .wk-r span:first-child{color:var(--muted);font-weight:600}

  .log-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .log-item:last-child{border-bottom:0}
  .log-date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0}
  .log-date b{display:block;font-family:var(--display);font-size:1.05rem}
  .log-date span{font-size:.7rem;text-transform:uppercase;color:var(--muted)}
  .log-body{flex:1;min-width:0}
  .log-body .ttl{font-weight:600}
  .log-body .meta{font-size:.85rem;color:var(--muted)}
  .log-open{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

  .pbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .pb{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
  .pb .d{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .pb .v{font-family:'IBM Plex Mono',monospace;font-size:1.25rem;font-weight:600}
  .pb .p{font-size:.75rem;color:var(--muted)}
  .pb.none .v{color:var(--muted)}
  .ach{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .ach:last-child{border-bottom:0}
  .ach .star{flex:none;width:32px;height:32px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:1rem}
  .ach .when{font-size:.8rem;color:var(--muted)}

  .chart-wrap{position:relative;direction:ltr}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}

  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .tm-top{display:flex;justify-content:space-between;align-items:center;max-width:720px;width:100%;margin:0 auto;gap:8px}
  .tm-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
  .tm-kind{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,11vw,4.5rem);letter-spacing:-.02em}
  .tm-kind.run{color:var(--accent)} .tm-kind.walk{color:var(--good)} .tm-kind.rep{color:var(--warn)}
  .tm-clock{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(4rem,24vw,9rem);line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
  .tm-sub{color:var(--muted);font-size:1.05rem;max-width:32ch}
  .tm-next{color:var(--muted);font-size:.9rem}
  .tm-bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;max-width:720px;width:100%;margin:0 auto 14px}
  .tm-bar i{display:block;height:100%;background:var(--accent)}
  .tm-ctrl{display:flex;gap:10px;max-width:720px;width:100%;margin:0 auto}
  .tm-ctrl .btn{flex:1;min-height:56px;font-size:1.05rem}
  .tm-big{min-height:84px!important;font-size:1.4rem!important;font-family:var(--display)}

  dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(10,12,18,.5)}
  .dlg-in{padding:20px;overflow-y:auto;max-height:88vh}
  .dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:600;min-height:40px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .days7{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px 2px;align-items:center;font-size:.8rem;text-align:center}
  .days7 .h{font-weight:700;color:var(--muted)}
  .days7 .r{text-align:start;font-weight:600;padding-inline-end:6px}
  .days7 input{width:22px;height:22px;margin:auto;accent-color:var(--accent)}
  .sync-state{font-size:.85rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
  pre.rules{font-size:.72rem;background:var(--surface-2);padding:10px;border-radius:10px;overflow-x:auto;white-space:pre;direction:ltr;text-align:left}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}
  .celebrate{text-align:center;padding:8px 0 4px;font-size:2rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div>
      <a class="back" href="index.html" id="backLink">← The Dot Den</a>
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="14.5" cy="4.5" r="2.2" fill="currentColor"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 3 4 3 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Silverun
      </div>
    </div>
    <div class="hdr-r">
      <button class="iconbtn" id="langBtn" aria-label="Switch language">עב</button>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </div>
  </header>

  <div class="goal" id="goalStrip"></div>

  <main>
    <section id="view-today"></section>
    <section id="view-plan" hidden></section>
    <section id="view-log" hidden></section>
    <section id="view-records" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8.5 15l2.5 2.5 4.5-4.5"/></svg><span id="tabToday">Today</span></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="tabPlan">Plan</span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg><span id="tabLog">Log</span></button>
    <button data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4"/></svg><span id="tabRecords">Records</span></button>
  </div>
</nav>

<div class="overlay" id="timer" hidden></div>

<dialog id="settingsDlg"><div class="dlg-in" id="settingsBody"></div></dialog>
<dialog id="measureDlg"><div class="dlg-in" id="measureBody"></div></dialog>

<script>
(function(){
'use strict';

/* ==========================================================
   Language (per device)
========================================================== */
var LANG='en';
try{ LANG=localStorage.getItem('silverun-lang')||((navigator.language||'').slice(0,2)==='he'?'he':'en'); }catch(e){}
function L(en,he){ return LANG==='he'?he:en; }
function applyLang(){
  var r=document.documentElement; r.lang=LANG; r.dir=L('ltr','rtl');
  document.title=L('Silverun · The Dot Den','Silverun · סילברן');
  $('backLink').textContent=L('← The Dot Den','→ The Dot Den');
  $('langBtn').textContent=L('עב','EN');
  $('langBtn').setAttribute('aria-label',L('עברית','English'));
  $('settingsBtn').setAttribute('aria-label',L('Settings','הגדרות'));

function fmtN(sec){

  var m=Math.floor(sec/60), s=sec-m*60;
  var ss=(Math.abs(s-Math.round(s))<0.05) ? pad(Math.round(s)) : (s<10?'0':'')+s.toFixed(1);
  if (ss==='60'){ m++; ss='00'; }

}

function fmtClock(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+':'+pad(sec%60); }

function parseTime(str,d){
  if (str==null) return null; str=String(str).trim().replace(',', '.');
  if (!str) return null;
  var m;
  if ((m=/^(\d{1,3}):(\d{1,2}(?:\.\d+)?)$/.exec(str))) { var s=+m[2]; if (s>=60) return null; return +m[1]*60+s; }
  if ((m=/^(\d{1,2})\.(\d{2})$/.exec(str)) && d>=200 && +m[1]<=30 && +m[2]<60) return +m[1]*60+ +m[2];

========================================================== */
var LS='silverun-v1';
var DEFAULT_START='2026-10-01';
function blank(){ return {v:1,days:{},measures:[],settings:{t:0,name:'',start:DEFAULT_START,practice:{0:['h'],2:['h'],3:['h','s'],5:['s']},voice:true,shift:null}}; }
var S;
try{ S=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ S=null; }
if (!S || !S.days) S=blank();
(function(){ var b=blank(); for (var k in b.settings) if (!(k in S.settings)) S.settings[k]=b.settings[k]; if(!S.measures) S.measures=[]; })();
function save(noSync){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} if (!noSync) queuePush(); }
function day(date,create){ if (!S.days[date] && create) S.days[date]={t:0}; return S.days[date]; }
function touch(date){ var d=day(date,true); d.t=now(); save(); }

/* ==========================================================
   Engine
========================================================== */
function practiceFor(date){ var d=S.days[date]; if (d && d.pa) return d.p||[]; return (S.settings.practice[dow(date)]||[]).slice(); }
function answered(date){ var d=S.days[date]; return !!(d&&d.pa); }
function doneSess(date){ var d=S.days[date]; return d && d.s && d.s.st==='done' ? d.s : null; }
function levelFor(ws){
  var start=weekStart(S.settings.start), lvl=1, w=start, zero=0, sh=S.settings.shift;
  if (sh && sh.from<=ws && sh.from>=start){ w=sh.from; lvl=sh.lvl; }
  while (w<ws){
    var keys={}, runs=0;
    for (var i=0;i<7;i++){ var s=doneSess(addDays(w,i)); if (s){ runs++; keys[s.key]=1; } }
    var key=(keys.L?1:0)+(keys.I?1:0)+(keys.E?1:0);
    if (key>=2){ lvl=Math.min(WEEKS,lvl+1); zero=0; }
    else if (runs===0){ zero++; if (zero>=2){ lvl=Math.max(1,lvl-1); zero=0; } }
    else zero=0;
    w=addDays(w,7);
  }
  return lvl;
}
function weekKeysDone(date){
  var ws=weekStart(date), keys={}, runs=0;
  for (var x=ws; x<date; x=addDays(x,1)){ var s=doneSess(x); if (s){ runs++; keys[s.key]=1; } }
  return {keys:keys,runs:runs};
}
function lastRunBefore(date){
  var start=S.settings.start;
  for (var x=addDays(date,-1), n=0; x>=start && n<60; x=addDays(x,-1), n++){ if (doneSess(x)) return x; }
  return null;
}
function wasHard(date){
  if (practiceFor(date).indexOf('h')>=0) return true;
  var s=doneSess(date); return !!(s && def(s.key,s.lvl).hard);
}
function suggest(date){
  var res={date:date,notes:[]}, start=S.settings.start;
  if (date<start){ res.type='before'; return res; }
  var ws=weekStart(date), lvl=levelFor(ws);
  res.lvl=lvl;
  var dd=S.days[date], prac=practiceFor(date); res.practice=prac;
  if (dd && dd.s && dd.s.key){ res.type='session'; res.key=dd.s.key; res.lvl=dd.s.lvl||lvl; res.stored=true; return res; }
  if (dd && dd.s && dd.s.st==='rest'){ res.type='rest'; res.reason='tired'; return res; }
  if (prac.indexOf('h')>=0){ res.type='practice'; return res; }
  var wk=weekKeysDone(date);
  if (wk.runs>=4){ res.type='rest'; res.reason='max'; return res; }
  if (doneSess(addDays(date,-1))&&doneSess(addDays(date,-2))&&doneSess(addDays(date,-3))){ res.type='rest'; res.reason='streak'; return res; }
  var yHard=wasHard(addDays(date,-1)), last=lastRunBefore(date), gap=last?diffDays(last,date):null;
  var slot=SLOT[dow(date)], comeback=last && gap>=7, order=[];
  if (comeback){ order=['E','F','L']; res.notes.push({k:'warn',t:L('Welcome back! It’s been '+gap+' days since the last run, so today is an easy one.','ברוך השב! עברו '+gap+' ימים מהריצה האחרונה, אז היום אימון קל.')}); }
  else { if (slot==='L'||slot==='I') order.push(slot); order.push('L','I','E','F'); }
  var pick=null;
  for (var i=0;i<order.length;i++){ var k=order[i]; if (wk.keys[k]) continue; if (k==='I' && yHard) continue; pick=k; break; }
  if (!pick){ res.type='rest'; res.reason= wk.keys.L&&wk.keys.I&&wk.keys.E ? 'weekdone' : 'recover'; return res; }
  var mon=addDays(ws,1);
  if (!comeback && pick==='L' && slot!=='L' && date>mon && mon>=start) res.notes.push({k:'info',t:L('Monday’s long run was missed, so it comes first today.','הריצה הארוכה של יום שני התפספסה, אז היא באה היום קודם.')});
  if (!comeback && pick!=='I' && slot==='I' && !wk.keys.I && yHard) res.notes.push({k:'info',t:L('Yesterday was a hard day, so the intervals wait — easier session today.','אתמול היה יום קשה, אז האינטרוולים מחכים — היום אימון קל יותר.')});
  if (prac.indexOf('s')>=0) res.notes.push({k:'info',t:L('Swimming later today — that’s light, running is fine.','יש שחייה אחר כך — זה קל, אפשר לרוץ.')});
  res.type='session'; res.key=pick; return res;
}

/* ==========================================================
   Effort data, PBs, achievements
========================================================== */
function efforts(){
  var out=[];
  S.measures.forEach(function(m){ if(!m.del && m.sec) out.push({date:m.date,d:m.d,sec:m.sec,src:'m',note:m.note||'',id:m.id}); });
  Object.keys(S.days).forEach(function(date){
    var s=S.days[date].s; if(!s||!s.key) return;
    var d=def(s.key,s.lvl);
    if (d.reps && s.reps) s.reps.forEach(function(v){ if(v) out.push({date:date,d:d.reps.d,sec:v,src:'s',note:d.title}); });
    if (d.test && s.test) out.push({date:date,d:d.test.d,sec:s.test,src:'s',note:d.title});
  });
  out.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.sec-b.sec; });
  return out;
}
function pbs(){ var best={}; efforts().forEach(function(e){ if(!best[e.d]||e.sec<best[e.d].sec) best[e.d]=e; }); return best; }
function achievements(){
  var list=[], seen={}, first=null;
  Object.keys(S.days).sort().forEach(function(date){
    var d=S.days[date], s=d.s;
    if (s && s.st==='done'){
      if (!first){ first=date; list.push({date:date,t:L('First Silverun session done','אימון Silverun ראשון הושלם'),auto:1}); }
      if (s.key==='L' && s.lvl===3 && !seen.l3){ seen.l3=1; list.push({date:date,t:L('First 12 minutes of nonstop running','12 דקות ריצה ברצף — פעם ראשונה'),auto:1}); }
      if (s.key==='L' && s.lvl===4 && !seen.l4){ seen.l4=1; list.push({date:date,t:L('First nonstop 2 km','2 ק״מ ראשונים ברצף'),auto:1}); }
      if (s.key==='L' && s.lvl>=5 && !seen.l5){ seen.l5=1; list.push({date:date,t:L('15 minutes nonstop','15 דקות ברצף'),auto:1}); }
      if (s.key==='L' && s.lvl===7 && !seen.l7){ seen.l7=1; list.push({date:date,t:L('20 minutes nonstop','20 דקות ברצף'),auto:1}); }
    }
    if (s && s.ach) list.push({date:date,t:s.ach});
    if (d.pl && d.pl.ach) list.push({date:date,t:d.pl.ach});
  });
  var best={};
  efforts().forEach(function(e){
    var b=best[e.d];
    if (!b){ best[e.d]=e.sec; list.push({date:e.date,t:L('First timed '+dname(e.d)+': ','זמן ראשון ל־'+dname(e.d)+': ')+fmt(e.sec),auto:1,minor:e.d!==2000}); }
    else if (e.sec<b){ best[e.d]=e.sec; list.push({date:e.date,t:L('New best '+dname(e.d)+': '+fmt(e.sec)+' (was '+fmt(b)+')','שיא חדש ב־'+dname(e.d)+': '+fmt(e.sec)+' (היה '+fmt(b)+')'),auto:1}); }
    if (e.d===2000 && e.sec<600 && !seen.goal){ seen.goal=1; list.push({date:e.date,t:L('🏆 GOAL: 2 km under 10:00 — ','🏆 היעד הושג: 2 ק״מ מתחת ל־10:00 — ')+fmt(e.sec),auto:1,big:1}); }
    if (e.d===1000 && e.sec<=300 && !seen.k1){ seen.k1=1; list.push({date:e.date,t:L('1 km at goal pace (5:00 or better)','1 ק״מ בקצב היעד (5:00 או פחות)'),auto:1}); }
  });
  var start=weekStart(S.settings.start), cur=weekStart(TODAY), prev=levelFor(start);
  for (var w=addDays(start,7); w<=cur; w=addDays(w,7)){
    var l=levelFor(w); if (l>prev) list.push({date:addDays(w,-1),t:L('Week '+prev+' complete → on to week '+l,'שבוע '+prev+' הושלם ← ממשיכים לשבוע '+l),auto:1}); prev=l;
  }
  list.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
  return list;
}

function ensureSess(date,sg){

  root.querySelectorAll('input[data-time]').forEach(function(inp){
    inp.oninput=function(){
      var idx=inp.dataset.time, dd=+inp.dataset.d, v=parseTime(inp.value,dd), s=ensureSess(date,sg);

    g.gain.setValueAtTime(vol||0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);

function openTimer(date){
  var s=S.days[date].s, d=def(s.key,s.lvl), steps=timeline(d);
  var i0=0; while (i0<steps.length && stepDone(s,steps[i0])) i0++;
  if (i0>=steps.length) i0=0;
  TM={date:date,d:d,steps:steps,i:i0,t0:0,acc:0,running:false,phase:'ready',lastBeep:-1,iv:null};
  $('timer').hidden=false; document.body.style.overflow='hidden';
  try{ if (!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  try{ if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wakeLock=w; }).catch(function(){}); }catch(e){}
  enterStep(); TM.iv=setInterval(tick,200);
}
function stepDone(s,st){ if (st.checks) return st.checks.every(function(c){return s.checks[c];}); return st.check? !!s.checks[st.check] : false; }
function closeTimer(){
  if (!TM) return; clearInterval(TM.iv); TM=null;
  $('timer').hidden=true; document.body.style.overflow='';

  try{ speechSynthesis.cancel(); }catch(e){}
  render();
}
function elapsed(){ return TM.acc + (TM.running ? (now()-TM.t0)/1000 : 0); }
function enterStep(){
  var st=TM.steps[TM.i]; TM.acc=0; TM.lastBeep=-1;
  if (st.t==='count'){ TM.running=true; TM.t0=now(); TM.phase='count'; } else { TM.running=false; TM.phase= st.t==='rep'?'ready':'manual'; }
  say(st.say); beep(880,0.35); buzz(250); drawTimer();
}
function markStep(st){ var s=S.days[TM.date].s; if (st.check) s.checks[st.check]=1; if (st.checks) st.checks.forEach(function(c){ s.checks[c]=1; }); touch(TM.date); }
function nextStep(mark){ if (mark) markStep(TM.steps[TM.i]); if (TM.i>=TM.steps.length-1){ finishTimer(); return; } TM.i++; enterStep(); }
function finishTimer(){
  TM.phase='end'; TM.running=false; say(L('Session complete. Well done!','האימון הסתיים. כל הכבוד!'));

}
function tick(){

}
function drawClock(){

function downloadCSV(){
  function q(v){ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  var head=L(['Date','Day','Type','Week','Session','Status','Checklist done','Rep/test times','Distance','Distance (km)','Longest nonstop (min)','Feel (1-10)','Practice','Notes','Achievement'],
             ['תאריך','יום','סוג','שבוע','אימון','סטטוס','בוצעו ברשימה','זמני חזרות/מבחן','מרחק','מרחק (ק״מ)','הכי ארוך ברצף (דק׳)','תחושה (1-10)','אימון קבוצה','הערות','הישג']);
  var rows=[head];
  var dates={}; Object.keys(S.days).forEach(function(k){ dates[k]=1; }); S.measures.forEach(function(m){ if(!m.del) dates[m.date]=1; });
  Object.keys(dates).sort().forEach(function(date){
    var d=S.days[date]||{}, prac=d.pa?plabel(d.p||[]):'';
    if (d.s && d.s.key){
      var df=def(d.s.key,d.s.lvl), ids=allItemIds(df), times=[];
      if (d.s.reps) d.s.reps.forEach(function(v){ if(v) times.push(fmtN(v)); });
      if (d.s.test) times.push(fmtN(d.s.test));
      rows.push([date,DOW(dow(date)),L('Run','ריצה'),df.lvl,df.title,d.s.st==='done'?L('Done','בוצע'):L('Started','התחיל'),
        ids.filter(function(i){return d.s.checks&&d.s.checks[i];}).length+'/'+ids.length,times.join(' | '),df.reps?M(df.reps.d):df.test?dname(df.test.d):'',d.s.dist||'',d.s.non||'',d.s.feel||'',prac,d.s.notes||'',d.s.ach||'']);
    } else if (d.s && d.s.st==='rest') rows.push([date,DOW(dow(date)),L('Rest','מנוחה'),'','','','','','','','','',prac,'','']);
    if (d.pl && (d.pl.feel||d.pl.notes||d.pl.ach||d.pl.c)) rows.push([date,DOW(dow(date)),L('Practice','אימון קבוצה'),'',plabel(d.pa?(d.p||[]):(S.settings.practice[dow(date)]||[])),'','','','','','',d.pl.feel||'',prac,d.pl.notes||'',d.pl.ach||'']);
    S.measures.forEach(function(m){ if(!m.del && m.date===date) rows.push([date,DOW(dow(date)),L('Timed','מדידת זמן'),'','','','',fmtN(m.sec),dname(m.d),'','','','',m.note||'','']); });
  });
  var csv='﻿'+rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='silverun-'+TODAY+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

  ach.forEach(function(a){ h+='<div class="ach"><div class="star">'+(a.big?'🏆':a.auto?'★':'⭐')+'</div><div><div>'+esc(a.t)+'</div><div class="when">'+nice(a.date)+'</div></div></div>'; });

  $('addM2').onclick=function(){ openMeasure(); };
  var cs=$('chartSel'); if (cs){ cs.onchange=function(){ chartD=+cs.value; drawChart(eff); }; drawChart(eff); }

function drawChart(eff){
  var wrap=$('chartWrap'); if(!wrap) return;
  var byDate={}; eff.forEach(function(e){ if (e.d!==chartD) return; if(!byDate[e.date]||e.sec<byDate[e.date]) byDate[e.date]=e.sec; });
  var pts=Object.keys(byDate).sort().map(function(k){ return {date:k,sec:byDate[k]}; });
  var W=640,H=240,Lm=52,R=16,T=14,B=30, goal = chartD>=200 ? chartD/1000*300 : null;
  var ys=pts.map(function(p){return p.sec;}); if (goal) ys.push(goal);
  var lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys), padv=Math.max((hi-lo)*0.15, chartD<200?0.5:5); lo-=padv; hi+=padv;
  var d0=pd(pts[0].date).getTime(), d1=pd(pts[pts.length-1].date).getTime(); if (d1===d0){ d0-=86400000*3; d1+=86400000*3; }
  function X(date){ return Lm+(pd(date).getTime()-d0)/(d1-d0)*(W-Lm-R); }
  function Y(v){ return T+(v-lo)/(hi-lo)*(H-T-B); } // faster (fewer seconds) sits higher
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(dname(chartD))+'">';
  for (var i=0;i<=4;i++){ var v=lo+(hi-lo)*i/4, y=Y(v);
    s+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(Lm-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+esc(fmtN(v))+'</text>'; }
  if (goal){ var gy=Y(goal); s+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(gy-6)+'" text-anchor="end" font-size="11" fill="var(--good)">'+L('goal ','יעד ')+esc(fmtN(goal))+'</text>'; }
  if (pts.length>1) s+='<path d="'+pts.map(function(p,i){ return (i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.sec).toFixed(1); }).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){ s+='<circle cx="'+X(p.date)+'" cy="'+Y(p.sec)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle cx="'+X(p.date)+'" cy="'+Y(p.sec)+'" r="16" fill="transparent" data-i="'+i+'" style="cursor:pointer"/>'; });
  s+='<text x="'+Lm+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+esc(nice(pts[0].date))+'</text>';
  if (pts.length>1) s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+esc(nice(pts[pts.length-1].date))+'</text>';
  s+='</svg><div class="tip" hidden></div>';
  wrap.innerHTML=s;
  var tip=wrap.querySelector('.tip'), svg=wrap.querySelector('svg');
  function show(i){ var p=pts[i], sc=svg.getBoundingClientRect().width/W; tip.hidden=false;
    tip.innerHTML='<b>'+esc(fmt(p.sec))+'</b> · '+esc(nice(p.date))+(pace(p.sec,chartD)?' · '+pace(p.sec,chartD):'');
    tip.style.left=(X(p.date)*sc)+'px'; tip.style.top=(Y(p.sec)*sc)+'px'; }
  wrap.querySelectorAll('[data-i]').forEach(function(c){
    c.addEventListener('mouseenter',function(){ show(+c.dataset.i); }); c.addEventListener('click',function(){ show(+c.dataset.i); });
    c.addEventListener('mouseleave',function(){ tip.hidden=true; });
  });
}

    toast(prev && v<prev.sec ? L('🎉 New best '+dname(d)+'!','🎉 שיא חדש ב־'+dname(d)+'!') : !prev ? L('First '+dname(d)+' saved!','זמן ראשון ל־'+dname(d)+' נשמר!') : L('Time saved','הזמן נשמר'));
  };
  dl.showModal();
}

  h+='<h3 style="margin-top:18px">'+L('Your data','הנתונים שלכם')+'</h3><p class="small muted" style="margin:4px 0 8px">'+L('Saved automatically on this device. Keep a backup now and then, or sign in above to keep a copy in the cloud.','נשמר אוטומטית במכשיר הזה. כדאי לשמור גיבוי מדי פעם, או להתחבר למעלה כדי לשמור עותק בענן.')+'</p>'+
    '<div class="row"><button class="btn sm" id="csv2">⬇ '+L('Spreadsheet (CSV)','גיליון (CSV)')+'</button><button class="btn sm" id="exp">'+L('Download backup','הורדת גיבוי')+'</button><label class="btn sm" style="display:inline-flex;align-items:center">'+L('Restore…','שחזור…')+'<input type="file" id="imp" accept="application/json,.json" hidden></label>'+

/* ==========================================================
   Cloud sync (same Firebase project / login as The Dot Den)
========================================================== */
var FIREBASE_CONFIG={apiKey:"AIzaSyC74q9XkmrfWaayfF-zfqASEelcvfzWMxs",authDomain:"dot-project-ebd1a.firebaseapp.com",projectId:"dot-project-ebd1a",
  storageBucket:"dot-project-ebd1a.firebasestorage.app",messagingSenderId:"595187560135",appId:"1:595187560135:web:7f60bce7dc37c06561d8e2"};
var fdb=null, fauth=null, user=null, syncState='off', syncErr='', unsub=null, lastRemote='';
try{
  if (window.firebase){ firebase.initializeApp(FIREBASE_CONFIG); fdb=firebase.firestore(); fauth=firebase.auth();
    try{ fdb.settings({experimentalAutoDetectLongPolling:true,merge:true}); }catch(e){} }
}catch(e){ fdb=null; fauth=null; }
function mergeState(a,b){
  var out=JSON.parse(JSON.stringify(a));
  Object.keys(b.days||{}).forEach(function(k){ var x=b.days[k], y=out.days[k]; if(!y || (x.t||0)>(y.t||0)) out.days[k]=x; });
  var byId={}; out.measures.forEach(function(m){ byId[m.id]=m; });
  (b.measures||[]).forEach(function(m){ var y=byId[m.id]; if(!y){ out.measures.push(m); byId[m.id]=m; } else if((m.t||0)>(y.t||0)){ out.measures[out.measures.indexOf(y)]=m; } });
  if (b.settings && (b.settings.t||0)>(out.settings.t||0)) out.settings=b.settings;
  return out;
}
function docRef(){ return fdb.collection('silverun').doc(user.uid); }
var pushT=null;
function queuePush(){ if (!user||!fdb||syncState==='denied') return; clearTimeout(pushT); pushT=setTimeout(push,1200); }
function push(){
  if (!user||!fdb) return;
  var body=JSON.stringify(S); if (body===lastRemote) return;
  docRef().set({data:body,updated:Date.now()}).then(function(){ lastRemote=body; syncState='ok'; drawSync(); }).catch(onSyncErr);
}
function onSyncErr(e){ syncState=(e && (e.code==='permission-denied' || /permission/i.test(e.message||''))) ? 'denied' : 'error'; syncErr=e && e.message || String(e); drawSync(); }
function startSync(){
  if (unsub){ unsub(); unsub=null; }
  syncState='connecting'; drawSync();
  unsub=docRef().onSnapshot(function(snap){
    if (snap.exists){
      var raw=snap.data().data;
      if (raw!==lastRemote){
        try{ var merged=mergeState(S,JSON.parse(raw)), changed=JSON.stringify(merged)!==JSON.stringify(S);
          lastRemote=raw; S=merged; save(true);
          if (changed && !TM && !(document.activeElement && document.activeElement.matches('input[type=text],textarea'))) render();
          if (JSON.stringify(S)!==raw) queuePush();
        }catch(e){}
      }
    } else queuePush();
    syncState='ok'; drawSync();
  }, onSyncErr);
}
if (fauth) fauth.onAuthStateChanged(function(u){ user=u; if (u) startSync(); else { if(unsub){unsub();unsub=null;} syncState='off'; drawSync(); } });
function drawSync(){
  var box=$('syncBox'); if (!box) return;
  if (!fauth){ box.innerHTML='<div class="sync-state">'+L('Sync isn’t available right now (offline?). Everything is still saved on this device.','סנכרון לא זמין כרגע (אין אינטרנט?). הכול עדיין נשמר במכשיר.')+'</div>'; return; }
  if (!user){
    box.innerHTML='<p class="small muted" style="margin-bottom:8px">'+L('Sign in with your Dot Den account to keep the data in the cloud and see the same log on your phone and his. Use the same account on both.','התחברו עם חשבון The Dot Den כדי לשמור את הנתונים בענן ולראות את אותו יומן בטלפון שלכם ושלו. משתמשים באותו חשבון בשניהם.')+'</p>'+
      '<input type="email" id="aE" placeholder="'+L('Email','אימייל')+'" autocomplete="username" style="margin-bottom:8px"><input type="password" id="aP" placeholder="'+L('Password','סיסמה')+'" autocomplete="current-password">'+
      '<div class="row" style="margin-top:8px"><button class="btn sm primary" id="aIn">'+L('Sign in','התחברות')+'</button><button class="btn sm" id="aUp">'+L('Create account','יצירת חשבון')+'</button></div><div class="small" id="aErr" style="color:var(--warn);margin-top:6px"></div>';
    var go=function(create){ var e=$('aE').value.trim(), p=$('aP').value; $('aErr').textContent='';
      (create?fauth.createUserWithEmailAndPassword(e,p):fauth.signInWithEmailAndPassword(e,p)).catch(function(err){ $('aErr').textContent=err.message; }); };
    $('aIn').onclick=function(){go(false);}; $('aUp').onclick=function(){go(true);};
    return;
  }
  var who=esc(user.email||user.displayName||'');
  var msg={connecting:L('Connecting…','מתחבר…'),ok:L('✓ Synced as ','✓ מסונכרן בתור ')+who,
    error:L('Couldn’t sync right now — will retry when online. ','לא הצלחנו לסנכרן כרגע — ננסה שוב כשיהיה אינטרנט. ')+'('+esc(syncErr)+')',
    denied:L('Signed in, but the database doesn’t allow Silverun yet. One-time fix: in the Firebase console → Firestore → Rules, add this inside <code>match /databases/{database}/documents { … }</code> and Publish:','מחוברים, אבל מסד הנתונים עוד לא מאשר את Silverun. תיקון חד־פעמי: בקונסולת Firebase ← Firestore ← Rules, מוסיפים את זה בתוך <code>match /databases/{database}/documents { … }</code> ולוחצים Publish:')}[syncState]||'';
  box.innerHTML='<div class="sync-state">'+msg+'</div>'+(syncState==='denied'?'<pre class="rules">match /silverun/{uid} {\n  allow read, write: if request.auth != null\n    && request.auth.uid == uid;\n}</pre>':'')+
    '<div class="row" style="margin-top:8px"><button class="btn sm" id="aOut">'+L('Sign out','התנתקות')+'</button>'+(syncState==='denied'||syncState==='error'?'<button class="btn sm" id="aRetry">'+L('Retry','לנסות שוב')+'</button>':'')+'</div>';
  $('aOut').onclick=function(){ fauth.signOut(); };
  var rt=$('aRetry'); if (rt) rt.onclick=function(){ startSync(); };
}

render();
