<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<title>Silverun · The Dot Den</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaedf3; --ink:#161a22; --muted:#5f6778; --line:#d6dbe4;
    --accent:#1f7a8c; --accent-ink:#ffffff; --accent-soft:#1f7a8c1a;
    --silver:#8a94a6; --gold:#b7791f; --gold-soft:#b7791f1f; --good:#1e8e4e; --good-soft:#1e8e4e1a;
    --warn:#b45309; --warn-soft:#b453091a; --hb:#c2410c; --swim:#2563eb;
    --shadow:0 18px 36px -24px rgba(20,24,40,.35); --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1117; --surface:#181b24; --surface-2:#222633; --ink:#eef1f7; --muted:#9aa3b5; --line:#2e3342;
      --accent:#5cc8d9; --accent-ink:#0b1a1e; --accent-soft:#5cc8d91f;
      --silver:#b7c0d0; --gold:#f2b84b; --gold-soft:#f2b84b1f; --good:#4fd08a; --good-soft:#4fd08a1c;
      --warn:#f59e0b; --warn-soft:#f59e0b1c; --hb:#fb923c; --swim:#60a5fa;
      --shadow:0 18px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1117; --surface:#181b24; --surface-2:#222633; --ink:#eef1f7; --muted:#9aa3b5; --line:#2e3342;
    --accent:#5cc8d9; --accent-ink:#0b1a1e; --accent-soft:#5cc8d91f;
    --silver:#b7c0d0; --gold:#f2b84b; --gold-soft:#f2b84b1f; --good:#4fd08a; --good-soft:#4fd08a1c;
    --warn:#f59e0b; --warn-soft:#f59e0b1c; --hb:#fb923c; --swim:#60a5fa;
    --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:16px;line-height:1.45;
    padding:0 16px calc(90px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
  h1,h2,h3,.brand{font-family:'Unbounded',system-ui,sans-serif;margin:0;text-wrap:balance}
  h2{font-size:1.15rem} h3{font-size:1rem}
  p{margin:0}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:720px;margin:0 auto}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}

  header.site{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 10px}
  .brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
  .brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--silver),var(--accent));color:#fff}
  .brand-mark svg{width:20px;height:20px}
  .back{font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:8px 0}
  .back:hover{color:var(--ink)}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
  .iconbtn svg{width:20px;height:20px}

  .goal{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:end;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
  .goal .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .goal .val{font-weight:700}
  .goal-bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--silver),var(--accent));border-radius:6px}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:.75rem;font-weight:600;color:var(--muted)}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card.flat{box-shadow:none}
  .eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 12px;min-height:36px;font-size:.875rem}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.block{width:100%}

  .daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .daynav h1{font-size:1.35rem}
  .daynav .sub{font-size:.85rem;color:var(--muted);text-align:center}

  .q h3{margin-bottom:10px}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:420px){.chips{grid-template-columns:repeat(2,1fr)}}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:600;font-size:.9rem;min-height:46px}
  .chip.suggest{border-style:dashed;border-color:var(--muted)}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .answered{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .note{border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px;display:flex;gap:8px}
  .note.info{background:var(--accent-soft)}
  .note.warn{background:var(--warn-soft)}
  .note.good{background:var(--good-soft)}

  .sess-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .sess-head h2{font-size:1.3rem;margin-top:4px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .tag.hard{background:var(--warn-soft);color:var(--warn)}
  .tag.easy{background:var(--good-soft);color:var(--good)}
  .tag.done{background:var(--good);color:#fff}
  .why{margin:8px 0 14px;color:var(--muted)}
  .progress{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:var(--good);border-radius:8px;transition:width .25s}

  .group{margin-top:14px}
  .group > .eyebrow{margin-bottom:4px}
  .check{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .check:last-child{border-bottom:0}
  .check input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    background:var(--surface);display:grid;place-items:center;margin:0;cursor:pointer}
  .check input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
  .check input[type=checkbox]:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .check .txt{flex:1;padding-top:2px}
  .check.on .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .check.on .sub{color:var(--muted)}
  .check .sub{display:block;font-size:.82rem;color:var(--muted);text-decoration:none}
  .timein{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .timein input{width:96px}
  .parsed{font-size:.82rem;color:var(--muted)}

  label.f{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
    width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .feel{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .feel button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;font-weight:700;font-size:.9rem;padding:0}
  .feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .feel-legend{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .actions .btn{flex:1}

  .ideas{margin:10px 0 0;padding-left:20px}
  .ideas li{margin:4px 0}

  table.t{width:100%;border-collapse:collapse;font-size:.9rem}
  table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  table.t tr.cur td{background:var(--accent-soft)}
  table.t tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .scrollx{overflow-x:auto}
  .wk{padding:10px 12px;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
  .wk.cur{border-color:var(--accent);background:var(--accent-soft)}
  .wk-n{font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center}
  .wk-r{display:grid;grid-template-columns:112px 1fr;gap:8px;font-size:.86rem;padding:2px 0}
  .wk-r span:first-child{color:var(--muted);font-weight:600}

  .log-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .log-item:last-child{border-bottom:0}
  .log-date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0}
  .log-date b{display:block;font-family:'Unbounded',sans-serif;font-size:1.05rem}
  .log-date span{font-size:.7rem;text-transform:uppercase;color:var(--muted)}
  .log-body{flex:1;min-width:0}
  .log-body .ttl{font-weight:600}
  .log-body .meta{font-size:.85rem;color:var(--muted)}
  .log-open{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

  .pbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .pb{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
  .pb .d{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .pb .v{font-family:'IBM Plex Mono',monospace;font-size:1.25rem;font-weight:600}
  .pb .p{font-size:.75rem;color:var(--muted)}
  .pb.none .v{color:var(--muted)}
  .ach{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .ach:last-child{border-bottom:0}
  .ach .star{flex:none;width:32px;height:32px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:1rem}
  .ach .when{font-size:.8rem;color:var(--muted)}

  .chart-wrap{position:relative}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}

  /* timer overlay */
  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .tm-top{display:flex;justify-content:space-between;align-items:center;max-width:720px;width:100%;margin:0 auto}
  .tm-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
  .tm-kind{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(2.2rem,11vw,4.5rem);letter-spacing:-.02em}
  .tm-kind.run{color:var(--accent)} .tm-kind.walk{color:var(--good)} .tm-kind.rep{color:var(--warn)}
  .tm-clock{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(4rem,24vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
  .tm-sub{color:var(--muted);font-size:1.05rem;max-width:32ch}
  .tm-next{color:var(--muted);font-size:.9rem}
  .tm-bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;max-width:720px;width:100%;margin:0 auto 14px}
  .tm-bar i{display:block;height:100%;background:var(--accent)}
  .tm-ctrl{display:flex;gap:10px;max-width:720px;width:100%;margin:0 auto}
  .tm-ctrl .btn{flex:1;min-height:56px;font-size:1.05rem}
  .tm-big{min-height:84px!important;font-size:1.4rem!important;font-family:'Unbounded',sans-serif}

  dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(10,12,18,.5)}
  .dlg-in{padding:20px;overflow-y:auto;max-height:88vh}
  .dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .days7{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px 2px;align-items:center;font-size:.8rem;text-align:center}
  .days7 .h{font-weight:700;color:var(--muted)}
  .days7 .r{text-align:left;font-weight:600;padding-right:6px}
  .days7 input{width:22px;height:22px;margin:auto;accent-color:var(--accent)}
  .sync-state{font-size:.85rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
  pre.rules{font-size:.72rem;background:var(--surface-2);padding:10px;border-radius:10px;overflow-x:auto;white-space:pre}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}
  .celebrate{text-align:center;padding:8px 0 4px;font-size:2rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div>
      <a class="back" href="index.html">← The Dot Den</a>
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="14.5" cy="4.5" r="2.2" fill="currentColor"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 3 4 3 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Silverun
      </div>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>

  <div class="goal" id="goalStrip"></div>

  <main>
    <section id="view-today"></section>
    <section id="view-plan" hidden></section>
    <section id="view-log" hidden></section>
    <section id="view-records" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8.5 15l2.5 2.5 4.5-4.5"/></svg>Today</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan</button>
    <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>Log</button>
    <button data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4"/></svg>Records</button>
  </div>
</nav>

<div class="overlay" id="timer" hidden></div>

<dialog id="settingsDlg"><div class="dlg-in" id="settingsBody"></div></dialog>
<dialog id="measureDlg"><div class="dlg-in" id="measureBody"></div></dialog>

<script>
(function(){
'use strict';

/* ==========================================================
   Dates (local time, YYYY-MM-DD strings)
========================================================== */
function pad(n){ return (n<10?'0':'')+n; }
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pd(s){ var a=s.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function addDays(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ds(d); }
function dow(s){ return pd(s).getDay(); }
function weekStart(s){ return addDays(s,-dow(s)); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); } // b - a
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nice(s){ var d=pd(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
function realToday(){
  var q=/[?&]today=(\d{4}-\d{2}-\d{2})/.exec(location.search);
  return q?q[1]:ds(new Date());
}
var TODAY=realToday();

/* ==========================================================
   Time parsing / formatting
========================================================== */
function fmt(sec){
  if (sec==null || isNaN(sec)) return '—';
  if (sec<60){ return (Math.round(sec*10)/10).toFixed(1)+' s'; }
  var m=Math.floor(sec/60), s=sec-m*60;
  var ss = (Math.abs(s-Math.round(s))<0.05) ? pad(Math.round(s)) : (s<10?'0':'')+s.toFixed(1);
  if (ss==='60'){ m++; ss='00'; }
  return m+':'+ss;
}
function fmtClock(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+':'+pad(sec%60); }
function fmtWatch(sec){ var m=Math.floor(sec/60), s=sec-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }
function pace(sec,d){ if(!sec||!d||d<200) return ''; var p=sec/d*1000; return fmtClock(p)+'/km'; }
// Accepts "1:32", "1:32.5", "9.8" (seconds), "1.32" (=1:32 for 200 m+), plain "95" (seconds) or "10" (minutes for 1 km+)
function parseTime(str,d){
  if (str==null) return null; str=String(str).trim().replace(',', '.');
  if (!str) return null;
  var m;
  if ((m=/^(\d{1,3}):(\d{1,2}(?:\.\d+)?)$/.exec(str))) { var s=+m[2]; if (s>=60) return null; return +m[1]*60+s; }
  if ((m=/^(\d{1,2})\.(\d{2})$/.exec(str)) && d>=200 && +m[1]<=30 && +m[2]<60) return +m[1]*60+ +m[2];
  if (/^\d+(\.\d+)?$/.test(str)){
    var v=+str;
    if (d>=1000 && v<=40) return v*60;
    return v>0?v:null;
  }
  return null;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function now(){ return Date.now(); }

/* ==========================================================
   The plan
========================================================== */
function rw(n,run,walk){ var a=[]; for(var i=0;i<n;i++){ a.push(['r',run]); if(i<n-1) a.push(['w',walk]); } return a; }
var WEEKS=8;
var KEYS={
  L:{name:'Longest run', tag:'Endurance', why:'Builds the engine — the ability to keep running. Chatting pace: if he can’t talk, slow down. Walk only where written.'},
  E:{name:'Easy run + strength', tag:'Easy', why:'Easy running plus a little strength for strong legs and fewer injuries. It should feel easy.'},
  I:{name:'Goal-pace intervals', tag:'Hard', why:'Teaches goal pace: 5:00 per km = 60 s per 200 m. Controlled and even — do NOT sprint the reps.'},
  F:{name:'Fun run', tag:'Easy', why:'Relaxed and fun — run together, try a new route. The strides wake the legs up.'}
};
var PLAN={
  L:[{segs:rw(3,6,1)},{segs:rw(2,9,1)},{segs:[['r',12],['w',1],['r',5]]},
     {test:{d:2000,easy:true},title:'First nonstop 2 km',why:'Easy pace, no stopping — speed doesn’t matter today. Just finish the 2 km. Time it for the record.'},
     {segs:[['r',15]]},{segs:[['r',18]]},{segs:[['r',20]]},{segs:[['r',15]],why:'Test week — keep this one relaxed.'}],
  E:[{segs:rw(3,4,1),str:1},{segs:rw(2,6,1),str:1},{segs:[['r',8],['w',1],['r',4]],str:1},{segs:[['r',12]],str:1},
     {segs:[['r',12]],str:1},{segs:[['r',14]],str:1},{segs:[['r',15]],str:1},
     {segs:[['r',10]],strides:4,title:'Easy run + strides',why:'No strength this week — fresh legs for the 2 km test.'}],
  I:[{reps:[4,300,95,120]},{reps:[4,300,90,120]},{reps:[5,300,90,120]},{reps:[4,400,120,150]},
     {reps:[5,400,120,120]},{reps:[3,600,180,180]},{reps:[2,800,240,180]},
     {test:{d:2000,goal:600},title:'The 2 km test',why:'The big one. First km controlled (4:55–5:00), then push the last 500 m. Starting too fast is the #1 mistake.'}],
  F:[{segs:rw(3,3,1),strides:4},{segs:rw(3,3,1),strides:4},{segs:rw(2,5,1),strides:4},
     {test:{d:1000,goal:320},title:'1 km time check',why:'Warm up well, then 1 km at a strong, even effort. Goal: 5:20 or better.'},
     {segs:[['r',10]],strides:4},
     {test:{d:1000,goal:305},title:'1 km time check',why:'Strong, even 1 km. Goal: about 5:05 — goal pace is getting close.'},
     {segs:[['r',12]],strides:4},
     {segs:[['r',10]],title:'Very easy jog',why:'After the test — enjoy an easy jog, or take the day off.'}]
};
// Default 6am slot per weekday (Sun=0)
var SLOT={1:'L',4:'E',5:'I',6:'F'};
function def(key,lvl){
  lvl=Math.max(1,Math.min(WEEKS,lvl||1));
  var p=PLAN[key][lvl-1], k=KEYS[key];
  var d={key:key,lvl:lvl,title:p.title||k.name,why:p.why||k.why,segs:p.segs||null,str:!!p.str,strides:p.strides||0,test:p.test||null,reps:null};
  if (p.reps) d.reps={n:p.reps[0],d:p.reps[1],t:p.reps[2],rest:p.reps[3]};
  d.hard = key==='I' || !!(d.test && !d.test.easy);
  return d;
}
function summary(d){
  if (d.reps) return d.reps.n+' × '+d.reps.d+' m in ~'+fmt(d.reps.t)+', '+fmt(d.reps.rest)+' walk between';
  if (d.test) return (d.test.d/1000)+' km'+(d.test.goal?' — goal '+fmt(d.test.goal):' nonstop, easy');
  var s=[], runs=d.segs.filter(function(x){return x[0]==='r';});
  var same = runs.length>1 && d.segs.every(function(x,i){ return x[0]===(i%2?'w':'r') && x[1]===d.segs[i%2][1]; });
  if (same) s.push(runs.length+' × ('+runs[0][1]+' min run + '+d.segs[1][1]+' min walk)');
  else s.push(d.segs.map(function(x){return x[1]+' min '+(x[0]==='r'?'run':'walk');}).join(' → '));
  if (d.str) s.push('strength');
  if (d.strides) s.push(d.strides+' strides');
  return s.join(' + ');
}
function items(d){
  var g=[];
  g.push({name:'Before',items:[{id:'pre',t:'Half a banana + a glass of water'}]});
  var w=[{id:'warm',t:'5 min warm-up: brisk walk, then easy jog'},{id:'drills',t:'Drills: 10 leg swings per leg, high knees 20 m, butt kicks 20 m'}];
  if (d.reps || d.test) w.push({id:'prime',t:'2 relaxed strides (60 m) to get ready'});
  g.push({name:'Warm-up',items:w});
  var m=[];
  if (d.segs){
    d.segs.forEach(function(s,i){
      if (s[0]!=='r') return;
      var nx=d.segs[i+1];
      m.push({id:'b'+i,t:'Run '+s[1]+' min — easy',sub: nx && nx[0]==='w' ? 'then walk '+nx[1]+' min' : ''});
    });
  }
  if (d.reps){
    for (var i=0;i<d.reps.n;i++) m.push({id:'r'+i,t:'Rep '+(i+1)+': '+d.reps.d+' m — target '+fmt(d.reps.t),sub: i<d.reps.n-1?'then '+fmt(d.reps.rest)+' walk / slow jog':'',time:{idx:i,d:d.reps.d,t:d.reps.t}});
  }
  if (d.test) m.push({id:'test',t: d.test.easy ? (d.test.d/1000)+' km nonstop, easy pace' : (d.test.d/1000)+' km — goal under '+fmt(d.test.goal),sub:'Time it',time:{idx:'test',d:d.test.d,t:d.test.goal}});
  if (d.strides) m.push({id:'strides',t:d.strides+' × 60 m relaxed-fast strides',sub:'walk back between'});
  g.push({name:'Main',items:m});
  if (d.str) g.push({name:'Strength — 2 rounds',items:[{id:'s1',t:'10 squats'},{id:'s2',t:'8 lunges per leg'},{id:'s3',t:'20–30 s plank'},{id:'s4',t:'15 calf raises'}]});
  g.push({name:'Finish',items:[{id:'cool',t:'3–5 min cool-down walk'},{id:'stretch',t:'Stretch calves, thighs, hips — 20 s each'}]});
  return g;
}
function allItemIds(d){ var a=[]; items(d).forEach(function(g){ g.items.forEach(function(it){ a.push(it.id); }); }); return a; }

/* ==========================================================
   State
========================================================== */
var LS='silverun-v1';
var DEFAULT_START='2026-10-01';
function blank(){
  return {v:1,days:{},measures:[],settings:{t:0,name:'',start:DEFAULT_START,practice:{0:['h'],2:['h'],3:['h','s'],5:['s']},voice:true,shift:null}};
}
var S;
try{ S=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ S=null; }
if (!S || !S.days) S=blank();
(function fill(){ var b=blank(); for (var k in b.settings) if (!(k in S.settings)) S.settings[k]=b.settings[k]; if(!S.measures) S.measures=[]; })();

var saveTimer=null;
function save(noSync){
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  if (!noSync) queuePush();
}
function day(date,create){
  if (!S.days[date] && create) S.days[date]={t:0};
  return S.days[date];
}
function touch(date){ var d=day(date,true); d.t=now(); save(); }
function touchSettings(){ S.settings.t=now(); save(); }

/* ==========================================================
   Engine
========================================================== */
function practiceFor(date){
  var d=S.days[date];
  if (d && d.pa) return d.p||[];
  return (S.settings.practice[dow(date)]||[]).slice();
}
function answered(date){ var d=S.days[date]; return !!(d&&d.pa); }
function doneSess(date){ var d=S.days[date]; return d && d.s && d.s.st==='done' ? d.s : null; }
function levelFor(ws){
  var start=weekStart(S.settings.start), lvl=1, w=start, zero=0;
  var sh=S.settings.shift;
  if (sh && sh.from<=ws && sh.from>=start){ w=sh.from; lvl=sh.lvl; }
  while (w<ws){
    var keys={}, runs=0;
    for (var i=0;i<7;i++){ var s=doneSess(addDays(w,i)); if (s){ runs++; keys[s.key]=1; } }
    var key=(keys.L?1:0)+(keys.I?1:0)+(keys.E?1:0);
    if (key>=2){ lvl=Math.min(WEEKS,lvl+1); zero=0; }
    else if (runs===0 && w>=weekStart(S.settings.start)){ zero++; if (zero>=2){ lvl=Math.max(1,lvl-1); zero=0; } }
    else zero=0;
    w=addDays(w,7);
  }
  return lvl;
}
function weekKeysDone(date){
  var ws=weekStart(date), keys={}, runs=0;
  for (var x=ws; x<date; x=addDays(x,1)){ var s=doneSess(x); if (s){ runs++; keys[s.key]=1; } }
  return {keys:keys,runs:runs};
}
function lastRunBefore(date){
  var start=S.settings.start;
  for (var x=addDays(date,-1), n=0; x>=start && n<60; x=addDays(x,-1), n++){ if (doneSess(x)) return x; }
  return null;
}
function wasHard(date){
  var p=practiceFor(date);
  if (p.indexOf('h')>=0) return true;
  var s=doneSess(date); if (s && def(s.key,s.lvl).hard) return true;
  return false;
}
function suggest(date){
  var res={date:date,notes:[]};
  var start=S.settings.start;
  if (date<start){ res.type='before'; return res; }
  var ws=weekStart(date), lvl=levelFor(ws);
  res.lvl=lvl; res.week=lvl;
  var dd=S.days[date];
  var prac=practiceFor(date); res.practice=prac;
  if (dd && dd.s && dd.s.key){ res.type='session'; res.key=dd.s.key; res.lvl=dd.s.lvl||lvl; res.stored=true; return res; }
  if (dd && dd.s && dd.s.st==='rest'){ res.type='rest'; res.reason='tired'; return res; }
  if (prac.indexOf('h')>=0){ res.type='practice'; return res; }
  var wk=weekKeysDone(date);
  if (wk.runs>=4){ res.type='rest'; res.reason='max'; return res; }
  var r1=doneSess(addDays(date,-1)), r2=doneSess(addDays(date,-2)), r3=doneSess(addDays(date,-3));
  if (r1&&r2&&r3){ res.type='rest'; res.reason='streak'; return res; }
  var yHard=wasHard(addDays(date,-1));
  var last=lastRunBefore(date), gap = last ? diffDays(last,date) : null;
  var order=[];
  var slot=SLOT[dow(date)];
  var comeback = last && gap>=7;
  if (comeback){ order=['E','F','L']; res.notes.push({k:'warn',t:'Welcome back! It’s been '+gap+' days since the last run, so today is an easy one.'}); }
  else {
    if (slot==='L'||slot==='I') order.push(slot);
    order.push('L','I','E','F');
  }
  var pick=null;
  for (var i=0;i<order.length;i++){
    var k=order[i];
    if (wk.keys[k]) continue;
    if (k==='I' && yHard){ continue; }
    pick=k; break;
  }
  if (!pick){ res.type='rest'; res.reason= wk.keys.L&&wk.keys.I&&wk.keys.E ? 'weekdone' : 'recover'; return res; }
  var mon=addDays(ws,1);
  if (!comeback && pick==='L' && slot!=='L' && date>mon && mon>=start) res.notes.push({k:'info',t:'Monday’s long run was missed, so it comes first today.'});
  if (!comeback && pick!=='I' && slot==='I' && !wk.keys.I && yHard) res.notes.push({k:'info',t:'Yesterday was a hard day, so the intervals wait — easier session today.'});
  if (prac.indexOf('s')>=0) res.notes.push({k:'info',t:'Swimming later today — that’s light, running is fine.'});
  res.type='session'; res.key=pick; return res;
}

/* ==========================================================
   Effort data, PBs, achievements
========================================================== */
function efforts(){
  var out=[];
  S.measures.forEach(function(m){ if(!m.del && m.sec) out.push({date:m.date,d:m.d,sec:m.sec,src:'m',note:m.note||'',id:m.id}); });
  Object.keys(S.days).forEach(function(date){
    var s=S.days[date].s; if(!s||!s.key) return;
    var d=def(s.key,s.lvl);
    if (d.reps && s.reps) s.reps.forEach(function(v){ if(v) out.push({date:date,d:d.reps.d,sec:v,src:'s',note:d.title}); });
    if (d.test && s.test) out.push({date:date,d:d.test.d,sec:s.test,src:'s',note:d.title});
  });
  out.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.sec-b.sec; });
  return out;
}
function pbs(){
  var best={}; efforts().forEach(function(e){ if(!best[e.d]||e.sec<best[e.d].sec) best[e.d]=e; }); return best;
}
function achievements(){
  var list=[], seen={};
  var dates=Object.keys(S.days).sort();
  var first=null;
  dates.forEach(function(date){
    var d=S.days[date], s=d.s;
    if (s && s.st==='done'){
      if (!first){ first=date; list.push({date:date,t:'First Silverun session done',auto:1}); }
      if (s.key==='L' && s.lvl===3 && !seen.l3){ seen.l3=1; list.push({date:date,t:'First 12 minutes of nonstop running',auto:1}); }
      if (s.key==='L' && s.lvl>=5 && !seen.l5){ seen.l5=1; list.push({date:date,t:'15 minutes nonstop',auto:1}); }
      if (s.key==='L' && s.lvl===7 && !seen.l7){ seen.l7=1; list.push({date:date,t:'20 minutes nonstop',auto:1}); }
    }
    if (s && s.ach) list.push({date:date,t:s.ach});
    if (d.pl && d.pl.ach) list.push({date:date,t:d.pl.ach});
  });
  var best={};
  efforts().forEach(function(e){
    var b=best[e.d];
    if (!b){ best[e.d]=e.sec; if (e.d===2000) list.push({date:e.date,t:'First timed 2 km: '+fmt(e.sec),auto:1}); else list.push({date:e.date,t:'First timed '+dname(e.d)+': '+fmt(e.sec),auto:1,minor:1}); }
    else if (e.sec<b){ best[e.d]=e.sec; list.push({date:e.date,t:'New best '+dname(e.d)+': '+fmt(e.sec)+' (was '+fmt(b)+')',auto:1}); }
    if (e.d===2000 && e.sec<600 && !seen.goal){ seen.goal=1; list.push({date:e.date,t:'🏆 GOAL: 2 km under 10:00 — '+fmt(e.sec),auto:1,big:1}); }
    if (e.d===1000 && e.sec<=300 && !seen.k1){ seen.k1=1; list.push({date:e.date,t:'1 km at goal pace (5:00 or better)',auto:1}); }
  });
  // week level-ups
  var start=weekStart(S.settings.start), cur=weekStart(TODAY), prev=levelFor(start);
  for (var w=addDays(start,7); w<=cur; w=addDays(w,7)){
    var l=levelFor(w); if (l>prev){ list.push({date:addDays(w,-1),t:'Week '+prev+' complete → on to week '+l,auto:1}); } prev=l;
  }
  list.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
  return list;
}
function dname(d){ return d>=1000 ? (d/1000)+' km' : d+' m'; }

/* ==========================================================
   UI helpers
========================================================== */
var $=function(id){ return document.getElementById(id); };
var view='today', cur=TODAY;
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2200);
}
function setTab(t){
  view=t;
  ['today','plan','log','records'].forEach(function(x){ $('view-'+x).hidden = x!==t; });
  document.querySelectorAll('nav.tabs button').forEach(function(b){ if (b.dataset.tab===t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(function(b){ b.addEventListener('click',function(){ if (b.dataset.tab==='today' && view==='today') cur=TODAY; setTab(b.dataset.tab); }); });

function render(){
  renderGoal();
  if (view==='today') renderToday();
  else if (view==='plan') renderPlan();
  else if (view==='log') renderLog();
  else renderRecords();
}
function renderGoal(){
  var b=pbs()[2000], lvl=levelFor(weekStart(TODAY < S.settings.start ? S.settings.start : TODAY));
  var pct = b ? Math.max(4,Math.min(100, Math.round((1 - (b.sec-600)/360)*100))) : 0;
  var name=S.settings.name?esc(S.settings.name)+'’s goal':'Goal';
  $('goalStrip').innerHTML=
    '<div><div class="lbl">'+name+'</div><div class="val">2 km under 10:00</div></div>'+
    '<div><div class="lbl">Best 2 km</div><div class="val mono">'+(b?fmt(b.sec):'not yet')+'</div></div>'+
    '<div><div class="lbl">Plan</div><div class="val">Week '+lvl+' of '+WEEKS+'</div></div>'+
    '<div class="goal-bar" title="Progress toward 10:00"><i style="width:'+(b?pct:0)+'%"></i></div>';
}

/* ---------------- TODAY ---------------- */
var PRACTICE_OPTS=[['none','No practice',[]],['h','Handball',['h']],['s','Swimming',['s']],['hs','Both',['h','s']]];
function pkey(arr){ var h=arr.indexOf('h')>=0, s=arr.indexOf('s')>=0; return h&&s?'hs':h?'h':s?'s':'none'; }
function plabel(arr){ var k=pkey(arr); return {none:'No practice',h:'Handball',s:'Swimming',hs:'Handball + swimming'}[k]; }

function renderToday(){
  var el=$('view-today'), date=cur, isToday=date===TODAY;
  var min=S.settings.start<TODAY?addDays(S.settings.start,-1):addDays(TODAY,-1);
  var h='<div class="daynav">'+
    '<button class="iconbtn" id="dPrev" aria-label="Previous day" '+(date<=min?'disabled':'')+'>‹</button>'+
    '<div><h1 style="text-align:center">'+(isToday?'Today':nice(date))+'</h1><div class="sub">'+(isToday?DOWL[dow(date)]+' '+pd(date).getDate()+' '+MON[pd(date).getMonth()]:(date<TODAY?'Past day — you can still log it':'Preview'))+'</div></div>'+
    '<button class="iconbtn" id="dNext" aria-label="Next day" '+(diffDays(TODAY,date)>=7?'disabled':'')+'>›</button></div>';
  if (!isToday) h+='<div class="row" style="justify-content:center;margin:-4px 0 12px"><button class="btn sm ghost" id="dToday">Back to today</button></div>';

  var sg=suggest(date);
  if (sg.type==='before'){
    var st=S.settings.start;
    h+='<div class="card"><div class="eyebrow">Almost time</div><h2 style="margin-top:6px">Silverun starts '+(diffDays(TODAY,st)===1?'tomorrow':'on '+nice(st))+'</h2>'+
       '<p class="why">'+nice(st)+', 6:00. Tap below to see the first session, or change the start date in settings.</p>'+
       '<button class="btn primary" id="goStart">See the first session →</button></div>';
    el.innerHTML=h; bindDayNav();
    $('goStart').onclick=function(){ cur=st; renderToday(); };
    return;
  }
  // practice question
  var ans=answered(date), prac=practiceFor(date), usual=(S.settings.practice[dow(date)]||[]);
  if (!ans){
    h+='<div class="card q"><h3>Is there a practice '+(isToday?'today':'on this day')+'?</h3>'+
      '<p class="small muted" style="margin:-4px 0 10px">Usually on '+DOWL[dow(date)]+': <b>'+plabel(usual)+'</b>. Holiday or cancelled? Tap “No practice”.</p><div class="chips">';
    PRACTICE_OPTS.forEach(function(o){ h+='<button class="chip'+(o[0]===pkey(usual)?' suggest':'')+'" data-p="'+o[0]+'">'+o[1]+'</button>'; });
    h+='</div></div>';
  } else {
    h+='<div class="card flat q" style="padding:12px 16px"><div class="answered"><span class="small muted">Practice:</span> <b>'+plabel(prac)+'</b><span class="spacer"></span><button class="btn sm ghost" id="pChange">Change</button></div></div>';
  }
  sg.notes.forEach(function(n){ h+='<div class="note '+n.k+'">'+esc(n.t)+'</div>'; });

  if (sg.type==='practice') h+=practiceCard(date,prac);
  else if (sg.type==='rest') h+=restCard(date,sg);
  else h+=sessionCard(date,sg);
  el.innerHTML=h;
  bindDayNav(); bindToday(date,sg);
}
function bindDayNav(){
  var p=$('dPrev'), n=$('dNext'), t=$('dToday');
  if (p) p.onclick=function(){ cur=addDays(cur,-1); renderToday(); };
  if (n) n.onclick=function(){ cur=addDays(cur,1); renderToday(); };
  if (t) t.onclick=function(){ cur=TODAY; renderToday(); };
}
function practiceCard(date,prac){
  var d=day(date)||{}, pl=d.pl||{};
  var h='<div class="card"><div class="sess-head"><div><div class="eyebrow">No running today</div><h2>'+plabel(prac)+' day</h2></div><span class="tag hard">Practice</span></div>'+
    '<p class="why">Handball is full of sprints — that’s his speed work today. No 6am run: legs need to be fresh for practice.</p>'+
    '<div class="group"><div class="eyebrow">Optional</div>'+
    chk(date,'pl',{id:'w',t:'Drink water through the day (bring a bottle to practice)'},pl.c)+
    chk(date,'pl',{id:'st',t:'5 min stretch after practice'},pl.c)+
    chk(date,'pl',{id:'sl',t:'In bed by 21:00'},pl.c)+'</div>'+

/* ---------------- GUIDED TIMER ---------------- */
var TM=null, audioCtx=null, wakeLock=null;
function beep(freq,dur,vol){
  try{
    if (!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=freq; o.type='sine'; g.gain.value=vol||0.25;
    o.connect(g); g.connect(audioCtx.destination);
    var t=audioCtx.currentTime; g.gain.setValueAtTime(vol||0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function say(txt){
  if (!S.settings.voice) return;
  try{ if (window.speechSynthesis){ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(txt); u.rate=1; speechSynthesis.speak(u); } }catch(e){}
}
function buzz(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function timeline(d){
  var st=[];
  st.push({t:'count',kind:'walk',label:'Warm-up',sub:'Brisk walk, then easy jog',sec:300,check:'warm',say:'Warm up. Five minutes. Walk, then easy jog.'});
  st.push({t:'manual',kind:'walk',label:'Drills',sub:'10 leg swings per leg · high knees 20 m · butt kicks 20 m',check:'drills',say:'Drills. Leg swings, high knees, butt kicks.'});
  if (d.reps||d.test) st.push({t:'manual',kind:'walk',label:'Strides',sub:'2 relaxed strides of 60 m, walk back',check:'prime',say:'Two relaxed strides.'});
  if (d.segs) d.segs.forEach(function(s,i){
    var run=s[0]==='r', runs=d.segs.filter(function(x){return x[0]==='r';}).length, ri=d.segs.slice(0,i+1).filter(function(x){return x[0]==='r';}).length;
    st.push({t:'count',kind:run?'run':'walk',label:run?'Run':'Walk',sub:run?(runs>1?'Block '+ri+' of '+runs+' · ':'')+'easy, chatting pace':'Walk and breathe — next run coming',sec:s[1]*60,check:run?'b'+i:null,say:(run?'Run ':'Walk ')+s[1]+(s[1]===1?' minute':' minutes')});
  });
  if (d.reps) for (var i=0;i<d.reps.n;i++){
    st.push({t:'rep',kind:'rep',label:'Rep '+(i+1)+' of '+d.reps.n,sub:d.reps.d+' m · target '+fmt(d.reps.t)+' · controlled, not a sprint',idx:i,d:d.reps.d,target:d.reps.t,check:'r'+i,say:'Rep '+(i+1)+'. '+d.reps.d+' metres. Get ready.'});
    if (i<d.reps.n-1) st.push({t:'count',kind:'walk',label:'Recover',sub:'Walk or slow jog',sec:d.reps.rest,check:null,say:'Recover. Walk.'});
  }
  if (d.test) st.push({t:'rep',kind:'rep',label:d.test.easy?'2 km nonstop':(d.test.d/1000)+' km test',sub:d.test.easy?'Easy pace — just keep going':'Goal '+fmt(d.test.goal)+' · even pace, strong finish',idx:'test',d:d.test.d,target:d.test.goal,check:'test',say:(d.test.d/1000)+' kilometres. Get ready.'});
  if (d.strides) st.push({t:'manual',kind:'run',label:'Strides',sub:d.strides+' × 60 m relaxed-fast, walk back',check:'strides',say:d.strides+' strides. Relaxed and fast.'});
  if (d.str) st.push({t:'manual',kind:'walk',label:'Strength',sub:'2 rounds: 10 squats · 8 lunges/leg · 20–30 s plank · 15 calf raises',checks:['s1','s2','s3','s4'],say:'Strength. Two rounds.'});
  st.push({t:'count',kind:'walk',label:'Cool-down',sub:'Easy walk',sec:240,check:'cool',say:'Great work. Cool down walk.'});
  st.push({t:'manual',kind:'walk',label:'Stretch',sub:'Calves, thighs, hips — 20 s each',check:'stretch',say:'Stretch. Calves, thighs, hips.'});
  return st;
}
function openTimer(date){
  var s=S.days[date].s, d=def(s.key,s.lvl), steps=timeline(d);
  // start at first unchecked step
  var i0=0; while (i0<steps.length && stepDone(s,steps[i0])) i0++;
  if (i0>=steps.length) i0=0;
  TM={date:date,d:d,steps:steps,i:i0,t0:0,acc:0,running:false,phase:'ready',lastBeep:-1,iv:null};
  $('timer').hidden=false; document.body.style.overflow='hidden';
  try{ if (!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  try{ if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wakeLock=w; }).catch(function(){}); }catch(e){}
  enterStep();
  TM.iv=setInterval(tick,200);
}
function stepDone(s,st){ if (st.checks) return st.checks.every(function(c){return s.checks[c];}); return st.check? !!s.checks[st.check] : false; }

  try{ speechSynthesis.cancel(); }catch(e){}

}
function elapsed(){ return TM.acc + (TM.running ? (now()-TM.t0)/1000 : 0); }
function enterStep(){

function markStep(st){
  var s=S.days[TM.date].s;

function nextStep(mark){

function tick(){

function drawClock(){

function drawTimer(){

     '<button class="btn sm ghost" id="tmVoice">'+(S.settings.voice?'🔊':'🔇')+'</button></div>';

function spoken(t){ var m=Math.floor(t/60), s=Math.round(t-m*60); return (m?m+' minute'+(m>1?'s ':' '):'')+s+' seconds'; }

function drawChart(eff){
  var wrap=$('chartWrap'); if(!wrap) return;
  var byDate={}; eff.forEach(function(e){ if (e.d!==chartD) return; if(!byDate[e.date]||e.sec<byDate[e.date]) byDate[e.date]=e.sec; });
  var pts=Object.keys(byDate).sort().map(function(k){ return {date:k,sec:byDate[k]}; });
  var W=640,H=240,L=52,R=16,T=14,B=30;
  var goal = chartD>=200 ? chartD/1000*300 : null;
  var ys=pts.map(function(p){return p.sec;}); if (goal) ys.push(goal);
  var lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys), padv=Math.max((hi-lo)*0.15, chartD<200?0.5:5);
  lo-=padv; hi+=padv;
  var d0=pd(pts[0].date).getTime(), d1=pd(pts[pts.length-1].date).getTime(); if (d1===d0){ d0-=86400000*3; d1+=86400000*3; }
  function X(date){ return L+(pd(date).getTime()-d0)/(d1-d0)*(W-L-R); }
  function Y(v){ return T+(v-lo)/(hi-lo)*(H-T-B); } // faster (fewer seconds) sits higher
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+dname(chartD)+' times over time">';
  var ticks=4;
  for (var i=0;i<=ticks;i++){ var v=lo+(hi-lo)*i/ticks, y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+esc(fmt(v))+'</text>'; }
  if (goal){ var gy=Y(goal); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(gy-6)+'" text-anchor="end" font-size="11" fill="var(--good)">goal '+esc(fmt(goal))+'</text>'; }
  var path=pts.map(function(p,i){ return (i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.sec).toFixed(1); }).join(' ');
  if (pts.length>1) s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){ s+='<circle cx="'+X(p.date)+'" cy="'+Y(p.sec)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+
    '<circle cx="'+X(p.date)+'" cy="'+Y(p.sec)+'" r="16" fill="transparent" data-i="'+i+'" style="cursor:pointer"/>'; });
  s+='<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+esc(nice(pts[0].date))+'</text>';
  if (pts.length>1) s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+esc(nice(pts[pts.length-1].date))+'</text>';
  s+='</svg><div class="tip" hidden></div>';
  wrap.innerHTML=s;
  var tip=wrap.querySelector('.tip'), svg=wrap.querySelector('svg');
  function show(i){ var p=pts[i], r=svg.getBoundingClientRect(), sc=r.width/W;
    tip.hidden=false; tip.innerHTML='<b>'+esc(fmt(p.sec))+'</b> · '+esc(nice(p.date))+(pace(p.sec,chartD)?' · '+pace(p.sec,chartD):'');
    tip.style.left=(X(p.date)*sc)+'px'; tip.style.top=(Y(p.sec)*sc)+'px'; }
  wrap.querySelectorAll('[data-i]').forEach(function(c){
    c.addEventListener('mouseenter',function(){ show(+c.dataset.i); });
    c.addEventListener('click',function(){ show(+c.dataset.i); });
    c.addEventListener('mouseleave',function(){ tip.hidden=true; });
  });
}

  syncState='connecting'; drawSync();
  unsub=docRef().onSnapshot(function(snap){
    if (snap.exists){
      var raw=snap.data().data; if (raw===lastRemote){ syncState='ok'; drawSync(); return; }
      try{ var remote=JSON.parse(raw); var merged=mergeState(S,remote); var changed=JSON.stringify(merged)!==JSON.stringify(S);
        lastRemote=raw; S=merged; save(true); if (changed && !TM && !document.activeElement.matches('input[type=text],textarea')) render();
        if (JSON.stringify(S)!==raw) queuePush();
      }catch(e){}
    } else queuePush();
    syncState='ok'; drawSync();
  }, onSyncErr);
}
if (fauth){
  fauth.onAuthStateChanged(function(u){ user=u; if (u) startSync(); else { if(unsub){unsub();unsub=null;} syncState='off'; drawSync(); } });
}
function drawSync(){
  var box=$('syncBox'); if (!box) return;
  if (!fauth){ box.innerHTML='<div class="sync-state">Sync isn’t available right now (offline?). Everything is still saved on this device.</div>'; return; }
  if (!user){
    box.innerHTML='<p class="small muted" style="margin-bottom:8px">Sign in with your Dot Den account to see the same log on your phone and his. Use the same account on both.</p>'+
      '<input type="email" id="aE" placeholder="Email" autocomplete="username" style="margin-bottom:8px"><input type="password" id="aP" placeholder="Password" autocomplete="current-password">'+
      '<div class="row" style="margin-top:8px"><button class="btn sm primary" id="aIn">Sign in</button><button class="btn sm" id="aUp">Create account</button></div><div class="small" id="aErr" style="color:var(--warn);margin-top:6px"></div>';
    var go=function(create){ var e=$('aE').value.trim(), p=$('aP').value; $('aErr').textContent='';
      (create?fauth.createUserWithEmailAndPassword(e,p):fauth.signInWithEmailAndPassword(e,p)).catch(function(err){ $('aErr').textContent=err.message; }); };
    $('aIn').onclick=function(){go(false);}; $('aUp').onclick=function(){go(true);};
    return;
  }
  var msg={connecting:'Connecting…',ok:'✓ Synced as '+esc(user.email||user.displayName||'you'),error:'Couldn’t sync right now — will retry when online. ('+esc(syncErr)+')',
    denied:'Signed in, but the database doesn’t allow Silverun yet. One-time fix: in the Firebase console → Firestore → Rules, add this inside <code>match /databases/{database}/documents { … }</code> and Publish:'}[syncState]||'';
  box.innerHTML='<div class="sync-state">'+msg+'</div>'+(syncState==='denied'?'<pre class="rules">match /silverun/{uid} {\n  allow read, write: if request.auth != null\n    && request.auth.uid == uid;\n}</pre>':'')+
    '<div class="row" style="margin-top:8px"><button class="btn sm" id="aOut">Sign out</button>'+(syncState==='denied'||syncState==='error'?'<button class="btn sm" id="aRetry">Retry</button>':'')+'</div>';
  $('aOut').onclick=function(){ fauth.signOut(); };
  var rt=$('aRetry'); if (rt) rt.onclick=function(){ startSync(); };
}
